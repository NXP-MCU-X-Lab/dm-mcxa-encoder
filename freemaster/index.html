<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRDM-MCXE31B Digital Encoder Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #0f2027;
            --bg-end: #2c5364;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.14);
            --accent-1: #00ff88;
            --accent-2: #00ccff;
            --accent-3: #87CEEB;
            --danger: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 600px at 80% -50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 60%), linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto 26px auto;
            padding: 12px 16px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

		.nxp-logo {
			width: 320px;
			height: auto;
			margin-bottom: 15px;
		}

        .header h1 {
            font-size: 1.6em;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.25);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-1);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.15);
        }

        .status-indicator.disconnected {
            background: var(--danger);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.15);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .data-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            border: 1px solid var(--card-border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(0,0,0,0.25);
        }

        .data-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.30);
        }

        .card-title {
            font-size: 1.05em;
            color: var(--accent-3);
            margin-bottom: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .data-value {
            font-size: 2.3em;
            font-weight: 700;
            margin: 14px 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.28);
        }

        .data-unit {
            font-size: 0.92em;
            color: var(--text-secondary);
        }

        .progress-container {
            margin-top: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 4px;
            transition: width 0.2s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 0.82em;
            margin-top: 6px;
            color: var(--text-secondary);
        }

        .angle-visual {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 18px auto 12px auto;
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(255,255,255,0.06), rgba(255,255,255,0.02) 60%, transparent 70%);
            box-shadow: inset 0 0 35px rgba(0,0,0,0.35);
        }

        .angle-pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 110px;
            background: var(--danger);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 0.08s ease;
            border-radius: 1px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);
        }

        .angle-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: var(--danger);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        .angle-markers {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .angle-marker {
            position: absolute;
            width: 2px;
            height: 12px;
            background: rgba(255, 255, 255, 0.5);
            top: 0;
            left: 50%;
            transform-origin: 50% 130px;
        }
        .angle-marker--minor {
            width: 1px;
            height: 8px;
            background: rgba(255, 255, 255, 0.35);
            transform-origin: 50% 130px;
        }

        .footer {
            text-align: center;
            margin-top: 26px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
	<div class="header">
		<img class="nxp-logo" src="nxp-logo.png" alt="NXP Logo">
		<h1><span class="status-indicator" id="status-led"></span>NXP MCXA344 Inductive Encoder Demo</h1>
	</div>

    <div class="data-grid">
        <!-- Multi-turn Counter -->
		<div class="data-card">
			<div class="card-title">Multi-turn Counter</div>
			<div class="data-value" id="multiturn-value">--</div>
			<div class="data-unit">Turns</div>
			<div class="error-message" id="multiturn-error"></div>
		</div>

        <!-- Angle Display -->
        <div class="data-card">
            <div class="card-title">Current Angle</div>
            <div class="angle-visual">
                <div class="angle-markers">
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(0deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(30deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(60deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(90deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(120deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(150deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(180deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(210deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(240deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(270deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(300deg);"></div>
                    <div class="angle-marker" style="transform: translateX(-50%) rotate(330deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(15deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(45deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(75deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(105deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(135deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(165deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(195deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(225deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(255deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(285deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(315deg);"></div>
                    <div class="angle-marker angle-marker--minor" style="transform: translateX(-50%) rotate(345deg);"></div>
                </div>
                <div class="angle-pointer" id="angle-pointer"></div>
                <div class="angle-center"></div>
            </div>
            <div class="data-value" id="degrees-value">--°</div>
            <div class="data-unit">Degrees (0-360)</div>
            <div class="error-message" id="degrees-error"></div>
            <div class="data-value" id="counts-value">--</div>
            <div class="data-unit">Counts (0-65535)</div>
            <div class="error-message" id="counts-error"></div>
        </div>

        <!-- Temperature Data -->
        <div class="data-card">
            <div class="card-title">Temperature</div>
            <div class="data-value" id="extra-value">--</div>
            <div class="data-unit">Celsius (°C)</div>
            <div class="error-message" id="extra-error"></div>
        </div>
    </div>

    <div class="footer">
        <div>FRDM-MCXE31B Digital Encoder Demo | Last Update: <span id="update-time">--</span></div>
        <div>Connection Status: <span id="connection-status">Disconnected</span></div>
    </div>

    <!-- Include necessary libraries -->
    <script src="simple-jsonrpc-js.js"></script>
    <script src="freemaster-client.js"></script>
    
    <script>
        // Global variables
        let pcm = null;
        let isConnected = false;
        let updateInterval = null;

        // Initialize PCM connection
        function initializePCM() {
            try {
                // Use default address or get from FreeMASTER
                let rpcsAddr = "localhost:41000";
                if (typeof FreeMASTER !== "undefined" && FreeMASTER.rpcs_addr) {
                    rpcsAddr = FreeMASTER.rpcs_addr;
                }

                pcm = new PCM(rpcsAddr, onSocketConnected, onSocketClose, onSocketError);
                pcm.OnServerError = onServerError;
                
                updateConnectionStatus("Connecting...");
                
            } catch (error) {
                console.error("PCM initialization failed:", error);
                updateConnectionStatus("Initialization Failed");
            }
        }

        // WebSocket connection successful
        function onSocketConnected() {
            isConnected = true;
            console.log("Connected to FreeMaster");
            updateConnectionStatus("Connected");
            document.getElementById('status-led').classList.remove('disconnected');
            
            // Enable events
            pcm.EnableEvents(true);
            
            // Start data update
            startDataUpdate();
        }

        // WebSocket connection closed
        function onSocketClose() {
            isConnected = false;
            console.warn("Connection closed");
            updateConnectionStatus("Connection Closed");
            document.getElementById('status-led').classList.add('disconnected');
            stopDataUpdate();
        }

        // WebSocket error
        function onSocketError(err) {
            isConnected = false;
            console.error("Socket error:", err);
            updateConnectionStatus("Connection Error");
            document.getElementById('status-led').classList.add('disconnected');
        }

        // Server error
        function onServerError(err) {
            console.error("Server error:", err);
        }

        // Update connection status display
        function updateConnectionStatus(status) {
            document.getElementById('connection-status').textContent = status;
        }

        // Read variable value
        async function readVariable(varName, varType = 'float', size = 4) {
            if (!pcm || !isConnected) {
                throw new Error("PCM not connected");
            }

            try {
                let response;
                switch (varType) {
                    case 'int':
                        response = await pcm.ReadIntVariable(varName, size);
                        break;
                    case 'uint':
                        response = await pcm.ReadUIntVariable(varName, size);
                        break;
                    case 'float':
                    default:
                        response = await pcm.ReadFloatVariable(varName, size);
                        break;
                }
                return response.data;
            } catch (error) {
                console.error(`Failed to read variable ${varName}:`, error);
                throw error;
            }
        }

        // Add global variable to track current angle
        let currentAngle = 0;

        // Calculate shortest rotation path
        function getShortestRotation(from, to) {
            let diff = to - from;
            
            // Normalize angle difference to -180 to 180 degree range
            while (diff > 180) diff -= 360;
            while (diff < -180) diff += 360;
            
            return from + diff;
        }

        async function updateDisplay() {
            if (!isConnected) return;

            try {
                // Read multi-turn counter (assuming uint type)
				try {
					const multiturn = await readVariable('encoder_result.turns', 'int', 4);
					document.getElementById('multiturn-value').textContent = multiturn;
					document.getElementById('multiturn-error').textContent = '';
				} catch (error) {
					document.getElementById('multiturn-error').textContent = 'Read failed: ' + error.message;
				}

                // Read angle value (float type)
                try {
                    const degrees = await readVariable('encoder_result.angle_deg', 'float', 4);
                    document.getElementById('degrees-value').textContent = degrees.toPrecision(8) + '°';
                    const targetAngle = getShortestRotation(currentAngle, degrees);
                    currentAngle = targetAngle;
                    document.getElementById('angle-pointer').style.transform = 
                        `translate(-50%, -100%) rotate(${targetAngle}deg)`;
                    document.getElementById('degrees-error').textContent = '';
                } catch (error) {
                    document.getElementById('degrees-error').textContent = 'Read failed: ' + error.message;
                }

                try {
                    const counts = await readVariable('encoder_result.angle_counts', 'uint', 2);
                    document.getElementById('counts-value').textContent = counts;
                    document.getElementById('counts-error').textContent = '';
                    
                } catch (error) {
                    document.getElementById('counts-error').textContent = 'Read failed: ' + error.message;
                }

                try {
                    const temperature = await readVariable('adc_result.temperature', 'float', 4);
                    document.getElementById('extra-value').textContent = temperature.toFixed(1) + '°C';
                    document.getElementById('extra-error').textContent = '';
                } catch (error) {
                    document.getElementById('extra-error').textContent = 'Read failed: ' + error.message;
                }
        
                // Update timestamp
                document.getElementById('update-time').textContent = 
                    new Date().toLocaleTimeString();
                    
            } catch (error) {
                console.error('Data update error:', error);
            }
        }

        // Start data update
        function startDataUpdate() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
            updateInterval = setInterval(updateDisplay, 50); // Update every 200ms
            updateDisplay(); // Update immediately once
        }

        // Stop data update
        function stopDataUpdate() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        // Initialize after page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Page loaded, initializing PCM...");
            initializePCM();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (pcm) {
                pcm.Shutdown();
            }
        });
    </script>
</body>
</html>
